name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: npx vercel@53.1.1 pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build with Vercel
        run: npx vercel@53.1.1 build --prod --token=$VERCEL_TOKEN

      - name: Deploy prebuilt output to Vercel
        run: npx vercel@53.1.1 deploy --prebuilt --prod --token=$VERCEL_TOKEN
