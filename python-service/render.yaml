services:
  - type: web
    name: sofascore-bridge
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SERVICE_TOKEN
        sync: false
      - key: SOFASCORE_BASE_URL
        value: https://api.sofascore.com/api/v1
      - key: SOFASCORE_TIMEOUT
        value: "15"
      - key: CACHE_TTL_MATCHES
        value: "60"
      - key: CACHE_TTL_LIVE
        value: "5"
      - key: CACHE_TTL_DETAILS
        value: "30"
      - key: CACHE_TTL_TEAM
        value: "3600"
      - key: CACHE_TTL_PLAYER
        value: "3600"
      - key: LOG_LEVEL
        value: INFO
